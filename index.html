    content="width=device-width, initial-scale=1.0"

<title>NEMESIS Custom Objectives</title>

    rel="stylesheet"
    href="style.css"

<script

```
<!-- =========================================
     시작 화면
========================================== -->

<section
    id="setupScreen"
    class="screen"
>

    <div class="logo">
        NEMESIS
    </div>

    <div class="subtitle">
        CUSTOM OBJECTIVES
    </div>

    <div class="card">

        <h2>
            게임 준비
        </h2>

        <p class="description">
            플레이어 수만큼 개인 목표를 무작위로 배정합니다.
        </p>

        <label for="playerCount">
            플레이어 수
        </label>

        <select id="playerCount">
            <option value="1">1명</option>
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
            <option value="5">5명</option>
        </select>

        <button
            id="startButton"
            class="primary-button"
        >
            목표 배정 시작
        </button>

    </div>

</section>


<!-- =========================================
     QR 코드 화면
========================================== -->

<section
    id="qrScreen"
    class="screen hidden"
>

    <div class="card">

        <h2>
            개인 목표 QR 코드
        </h2>

        <p
            id="currentPlayer"
            class="description"
        >
            플레이어 1
        </p>

        <div
            id="qrcode"
            class="qr-container"
        ></div>

        <p
            id="qrPlayerNumber"
            class="qr-player-number"
        >
            플레이어 1
        </p>

        <p
            id="progressText"
            class="progress-text"
        >
            1 / 1
        </p>

        <button
            id="nextPlayerButton"
            class="primary-button"
        >
            다음 플레이어
        </button>

    </div>

</section>


<!-- =========================================
     개인 목표 화면
========================================== -->

<section
    id="objectiveScreen"
    class="screen hidden"
>

    <div class="card objective-card">

        <div
            id="objectivePlayer"
            class="objective-player"
        >
            PLAYER 1
        </div>

        <div class="objective-image-container">

            <img
                id="objectiveImage"
                class="objective-image"
                alt="개인 목표"
            >

            <div
                id="objectiveImagePlaceholder"
                class="objective-image-placeholder"
            >
                개인 목표
            </div>

        </div>

        <h2
            id="objectiveTitle"
            class="objective-title"
        >
        </h2>

        <div
            id="objectiveText"
            class="objective-text"
        >
        </div>

        <button
            id="hideObjectiveButton"
